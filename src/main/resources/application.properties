# Uncomment to debug hibernate
# quarkus.hibernate-orm.log.sql=true
quarkus.log.level = INFO
%dev.quarkus.log.category."ibb.api".level = DEBUG

quarkus.datasource.devservices.db-name=ibb-go
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=*

quarkus.datasource.db-kind = mysql
quarkus.hibernate-orm.jdbc.statement-batch-size = 50
quarkus.transaction-manager.default-transaction-timeout = 300
quarkus.http.limits.max-form-attribute-size = 100M
quarkus.http.limits.max-body-size=100M

quarkus.hibernate-orm.database.generation = drop-and-create
%prod.quarkus.hibernate-orm.database.generation = none

